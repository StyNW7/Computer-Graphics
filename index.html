<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please Wait...</title>
    <link rel="shortcut icon" href="assets/Others/minecraftLogo.png" type="image/x-icon">
    <link rel="stylesheet" href="LoadingScreen/style.css">
</head>
<body>

    <section id="loadingScreen">
        <div class="animationWrapper">
            <div>
                <img src="assets/Others/pigMC.png" alt="" class="cloud cloud1">
            </div>
            <div>
                <img src="assets/Others/pigMC.png" alt="" class="cloud cloud2">
            </div>
        </div>
        <div id="middleScreen">
            <div id="bar">
                <div class="progressBar"></div>
            </div>
        </div>
        <div id="helpBox">
            <h2>Controls</h2>
            <ul>
                <li>Space: Change Camera</li>
                <li>S: Stop/Start Animation</li>
            </ul>
        </div>
    </section>

    <script src="LoadingScreen/script.js"></script>

</body>
</html>
